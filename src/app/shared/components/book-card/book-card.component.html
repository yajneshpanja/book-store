<mat-card class="book-card" [routerLink]="['/books', book.id]">
  <div class="book-card__cover">
    <img
      [src]="book.coverImage"
      [alt]="book.title + ' cover'"
      class="book-card__img"
      loading="lazy"
    />
    <div class="book-card__category-badge">{{ book.category }}</div>
  </div>

  <mat-card-content class="book-card__body">
    <h3 class="book-card__title">{{ book.title }}</h3>
    <p class="book-card__author">{{ book.author }}</p>

    <div class="book-card__rating" [attr.aria-label]="book.rating + ' out of 5 stars'">
      @for (icon of starIcons; track $index) {
        <mat-icon class="star-icon">{{ icon }}</mat-icon>
      }
      <span class="rating-value">{{ book.rating }}</span>
    </div>

    <div class="book-card__footer">
      <span class="book-card__price">\${{ book.price.toFixed(2) }}</span>
      <button
        mat-flat-button
        color="primary"
        class="add-btn"
        (click)="onAddToCart($event)"
        [attr.aria-label]="'Add ' + book.title + ' to cart'"
      >
        <mat-icon>add_shopping_cart</mat-icon>
        Add
      </button>
    </div>
  </mat-card-content>
</mat-card>
