<footer class="footer">
  <div class="container">
    <div class="footer-grid">

      <!-- Brand column -->
      <div class="footer-brand">
        <a routerLink="/" class="footer-logo">
          <mat-icon>menu_book</mat-icon>
          <span>Bookstore</span>
        </a>
        <p class="footer-tagline">
          Discover your next great read. Quality books delivered to your door.
        </p>
      </div>

      <!-- Quick links -->
      <div class="footer-col">
        <h4 class="footer-heading">Explore</h4>
        <ul class="footer-links">
          <li><a routerLink="/">Home</a></li>
          <li><a routerLink="/books">All Books</a></li>
          <li><a routerLink="/cart">My Cart</a></li>
        </ul>
      </div>

      <!-- Categories -->
      <div class="footer-col">
        <h4 class="footer-heading">Categories</h4>
        <ul class="footer-links">
          @for (cat of categories; track cat.value) {
            <li>
              <a [routerLink]="['/books']" [queryParams]="{ category: cat.value }">
                {{ cat.label }}
              </a>
            </li>
          }
        </ul>
      </div>

    </div>

    <div class="footer-bottom">
      <span>© {{ year }} Bookstore. All rights reserved.</span>
    </div>
  </div>
</footer>
